name: Remediate dependencies

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install current lockfile
        run: npm ci

      - name: Apply safe npm audit fixes to lockfile
        run: npm audit fix --package-lock-only

      - name: Commit remediated lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json package.json; then
            echo "No dependency lockfile changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json package.json
          git commit -m "fix dependency audit vulnerabilities"
          git push origin HEAD:${{ github.head_ref }}
