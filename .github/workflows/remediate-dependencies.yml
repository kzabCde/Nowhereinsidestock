name: Upgrade framework dependencies

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Upgrade Next.js and React stack
        run: npm install next@16.3.0 react@latest react-dom@latest eslint-config-next@16.3.0 --save

      - name: Commit dependency upgrade
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json package.json; then
            echo "Framework dependencies already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json package.json
          git commit -m "upgrade Next.js to 16.3.0"
          git push origin HEAD:${{ github.head_ref }}
