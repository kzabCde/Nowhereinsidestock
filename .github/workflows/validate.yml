name: Validate Security Upgrade

on:
  push:
    branches:
      - agent/security-dependency-upgrade

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install current dependencies
        run: npm ci

      - name: Raise Next.js security floor
        run: npm install next@^16.3.5 --save --package-lock-only

      - name: Apply non-breaking security fixes to lockfile
        run: npm audit fix --package-lock-only

      - name: Reinstall from repaired lockfile
        run: npm ci

      - name: Reject high-severity dependency vulnerabilities
        run: npm audit --audit-level=high

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Restore normal CI workflow and commit validated upgrades
        run: |
          git fetch origin main --depth=1
          git show origin/main:.github/workflows/validate.yml > .github/workflows/validate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/validate.yml
          git diff --cached --quiet && exit 0
          git commit -m "chore: update vulnerable dependencies [skip ci]"
          git push origin HEAD:agent/security-dependency-upgrade
