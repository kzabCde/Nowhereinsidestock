name: Validate Security Upgrade

on:
  push:
    branches:
      - agent/security-dependency-upgrade

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install current dependencies
        run: npm ci

      - name: Apply non-breaking security fixes to lockfile
        run: npm audit fix --package-lock-only

      - name: Reinstall from repaired lockfile
        run: npm ci

      - name: Reject high-severity dependency vulnerabilities
        run: npm audit --audit-level=high

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Upload repaired lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repaired-package-lock
          path: package-lock.json
          if-no-files-found: error
